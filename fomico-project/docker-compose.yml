version: '3.8'

services:
  # Frontend Next.js
  fomico-frontend:
    build:
      context: ./fomico-nextjs
      dockerfile: Dockerfile
    container_name: fomico-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:1337
      - NEXT_PUBLIC_STRAPI_API_TOKEN=${STRAPI_API_TOKEN}
    depends_on:
      - fomico-strapi
    networks:
      - fomico-network

  # Backend Strapi
  fomico-strapi:
    build:
      context: ./fomico-strapi
      dockerfile: Dockerfile
    container_name: fomico-strapi
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production
      # Leave DATABASE_URL empty to use the local `fomico-postgres` container below
      # (default). Set it in your .env to point at Neon instead, e.g.:
      # DATABASE_URL=postgresql://user:pass@ep-xxxx-pooler.region.aws.neon.tech/dbname?sslmode=require
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=fomico-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=strapi
      - DATABASE_PASSWORD=${DB_PASSWORD:-strapi}
      - DATABASE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-your-admin-jwt-secret}
      - API_TOKEN_SALT=${API_TOKEN_SALT:-your-api-token-salt}
      - APP_KEYS=${APP_KEYS:-key1,key2,key3,key4}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT:-your-transfer-token-salt}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      - fomico-postgres
    networks:
      - fomico-network

  # Database PostgreSQL (used only when DATABASE_URL is not set, e.g. local/dev).
  # If you're using Neon, this container still starts but stays unused — you can
  # skip it entirely with: docker compose up -d --scale fomico-postgres=0
  fomico-postgres:
    image: postgres:15-alpine
    container_name: fomico-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=strapi
      - POSTGRES_USER=strapi
      - POSTGRES_PASSWORD=${DB_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fomico-network

  # Nginx Reverse Proxy
  fomico-nginx:
    image: nginx:alpine
    container_name: fomico-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
    depends_on:
      - fomico-frontend
      - fomico-strapi
    networks:
      - fomico-network

  # Certbot (SSL Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: fomico-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - fomico-network

volumes:
  postgres_data:
  strapi-uploads:
  certbot-data:

networks:
  fomico-network:
    driver: bridge
